name: CI

# One run per commit (ADR-0179): a pull request's commits run on `pull_request` and `main`'s on `push`. A newer
# commit of a pull request cancels the older one's run; each commit of `main` has a group of its own, so no run of
# a merged commit is cancelled or replaced.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Non-secret, test-only values so typecheck/test/build can run in CI.
      # Real secrets are provided via the environment/secret manager at runtime.
      SESSION_SECRET: ci-session-secret-0000000000000000
      HEALTHCHECK_API_TOKEN: ci-healthcheck-token-000000000000
      STORAGE_SIGNING_SECRET: ci-storage-signing-secret-0000
      VIDEO_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @app/database run db:generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

  media:
    # Real FFmpeg: proves the dormant composer and inspector do what their
    # argument vectors say, and that the committed disclosure images survive a
    # real encode (ADR-0072). Pinned to Ubuntu 24.04, whose FFmpeg 6.1.1 the
    # suites' tolerances were measured with; no provider, network media or
    # secret is involved.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        # The package mirror has been slow, and has hung, here before: a hang fails the job instead of holding it.
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Media tests
        run: pnpm run test:media

  storage:
    # The Cloud Storage emulator (ADR-0156): proves the Google Cloud Storage
    # adapter against a store that speaks the JSON API. A service container
    # takes no arguments, so the emulator is configured by its FAKE_GCS_*
    # variables. No Google account, credential or store on the network is
    # involved, and the suites refuse an emulator that is not on this machine.
    # Beside it, a ClamAV daemon (ADR-0163) proves the scanner adapter. Its
    # signature updater and mail filter are off, so it sends no request; its
    # own image's PING check, every 2 s, says when it has loaded. And Mailpit,
    # a mail catcher, proves the SMTP email sender (ADR-0166): it makes its own
    # certificate for mail.rd6.test, so no key is kept here, requires STARTTLS
    # before anything is sent, accepts any login, so no credential is written
    # here, and relays nothing, since no relay is configured.
    runs-on: ubuntu-24.04
    services:
      gcs:
        image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
        env:
          FAKE_GCS_SCHEME: http
          FAKE_GCS_BACKEND: memory
          FAKE_GCS_PORT: "4443"
          # Warnings only: at the default level it logs each upload session's id.
          FAKE_GCS_LOG_LEVEL: warn
        ports: ["4443:4443"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:4443/_internal/healthcheck"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      clamav:
        image: clamav/clamav:1.5.5@sha256:64e30c0bf976198024deb3dc6d5cfe2485fb969c0f73549ba0fdb364b9469614
        env:
          CLAMAV_NO_FRESHCLAMD: "true"
          CLAMAV_NO_MILTERD: "true"
        ports: ["3310:3310"]
        options: >-
          --health-cmd clamdcheck.sh
          --health-interval 2s
          --health-timeout 5s
          --health-retries 45
          --health-start-period 1s
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        env:
          MP_DISABLE_VERSION_CHECK: "true"
          MP_SMTP_TLS_CERT: "sans:mail.rd6.test"
          MP_SMTP_TLS_KEY: "sans:mail.rd6.test"
          MP_SMTP_REQUIRE_STARTTLS: "true"
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      GOOGLE_CLOUD_STORAGE_TEST_ENDPOINT: http://127.0.0.1:4443
      CLAMAV_TEST_PORT: "3310"
      MAILPIT_TEST_SMTP_PORT: "1025"
      MAILPIT_TEST_API_PORT: "8025"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cloud Storage emulator tests
        run: pnpm run test:gcs

      - name: ClamAV scanner tests
        run: pnpm run test:clamav

      - name: SMTP email sender tests
        run: pnpm run test:smtp

  database:
    # Live PostgreSQL: proves the migrations apply to an empty database, that
    # it holds each one with its committed file's checksum, that no migration
    # the first parent held changed (ADR-0191), that the committed schema has
    # no drift, and that the Prisma repositories obey their tenant-scoping
    # contract. Throwaway credentials only. The development
    # pipeline's suite also runs FFmpeg (ADR-0107), so this job installs it on
    # the same Ubuntu 24.04 as the media job. That suite runs on the Cloud
    # Storage emulator too, a service as in the storage job (ADR-0162).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.16-trixie@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: revt
          POSTGRES_PASSWORD: revt-ci-local
          POSTGRES_DB: revt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      gcs:
        image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
        env:
          FAKE_GCS_SCHEME: http
          FAKE_GCS_BACKEND: memory
          FAKE_GCS_PORT: "4443"
          # Warnings only: at the default level it logs each upload session's id.
          FAKE_GCS_LOG_LEVEL: warn
        ports: ["4443:4443"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:4443/_internal/healthcheck"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://revt:revt-ci-local@localhost:5432/revt?schema=public
      SHADOW_DATABASE_URL: postgresql://revt:revt-ci-local@localhost:5432/revt_shadow?schema=public
      GOOGLE_CLOUD_STORAGE_TEST_ENDPOINT: http://127.0.0.1:4443
    steps:
      - uses: actions/checkout@v4
        # The first parent too, for the append-only check; no later step needs Git credentials (ADR-0191).
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install FFmpeg
        # The package mirror has been slow, and has hung, here before: a hang fails the job instead of holding it.
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @app/database run db:generate

      - name: Apply migrations to an empty database
        run: pnpm --filter @app/database run db:migrate

      - name: Check the applied migrations' checksums
        # Each finished row of _prisma_migrations against the SHA-256 of its committed file; names only are printed.
        timeout-minutes: 2
        run: >-
          PGPASSWORD=revt-ci-local PGHOST=localhost PGUSER=revt PGDATABASE=revt
          bash tests/migrations/checksums.sh packages/database/prisma/migrations

      - name: Create shadow database for the drift check
        run: PGPASSWORD=revt-ci-local psql -h localhost -U revt -d revt -c 'CREATE DATABASE revt_shadow'

      - name: Verify committed migrations match the schema
        run: pnpm --filter @app/database exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Check that no applied migration changed
        # The first parent stands for the previous release until production records its own (ADR-0191 Decision 1).
        # "shell: bash" runs it with pipefail, so a failed git archive fails the step whatever tar reads.
        timeout-minutes: 2
        shell: bash
        run: |
          if ! git rev-parse --verify --quiet 'HEAD^1^{commit}' > /dev/null; then
            echo "::error::The first parent, HEAD^1, is not in the checkout: the job needs fetch-depth: 2."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/parent"
          git archive "$(git rev-parse HEAD^1)" packages/database/prisma | tar -x -C "$RUNNER_TEMP/parent"
          bash tests/migrations/append-only.sh "$RUNNER_TEMP/parent/packages/database/prisma" packages/database/prisma

      - name: Database integration tests
        run: pnpm run test:db

  e2e:
    # The browser test (ADR-0121): Chromium drives the web app, run by
    # `next dev` with the test provider and a shared folder, against a
    # PostgreSQL service container with throwaway credentials. FFmpeg draws the
    # photos it uploads. No provider, network media or secret is involved.
    runs-on: ubuntu-24.04
    # The two installs may take thirty minutes each; nothing else runs long.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.16-trixie@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: revt
          POSTGRES_PASSWORD: revt-ci-local
          POSTGRES_DB: revt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://revt:revt-ci-local@localhost:5432/revt?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        # The package mirror has been slow, and has hung, here before: a hang fails the job instead of holding it.
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @app/database run db:generate

      - name: Apply migrations to an empty database
        run: pnpm --filter @app/database run db:migrate

      - name: Install Chromium for Playwright
        timeout-minutes: 30
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        # `next dev` restarts past 80% of its heap limit, after answering a request; a request
        # still in flight, or one made during the restart, is lost: a run in which it restarted
        # fails and says so, passed or not.
        run: |
          set -o pipefail
          status=0
          pnpm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log" || status=$?
          if grep -qF "Server is approaching the used memory threshold, restarting" "$RUNNER_TEMP/e2e.log"; then
            echo "::error title=next dev restarted::its heap passed 80% of its limit during the browser tests"
            exit 1
          fi
          exit "$status"

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  web-image:
    # The web app's production image (ADR-0175), built from this commit and run
    # with no network, a read-only root, no capabilities and no new privileges.
    # It must refuse a production start without settings, with NEXT_PHASE
    # naming the build and with a setting that widens what Node.js trusts
    # (ADR-0184), and serve with stand-in settings that point nowhere.
    # Nothing is pushed: no registry, login, secret or cache. The base image is
    # pinned by digest; readiness against live services is RD-11's. The very
    # image is then scanned with pinned Syft and Grype (ADR-0180).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REVISION: ${{ github.sha }}
      SYFT_PIN: ghcr.io/anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
      GRYPE_PIN: ghcr.io/anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the web image
        timeout-minutes: 20
        run: >-
          docker buildx build --provenance=false --load --platform linux/amd64
          -f apps/web/Dockerfile
          --label "org.opencontainers.image.revision=$REVISION"
          --tag vtavision-web:ci .

      - name: Refuse a production start without settings
        timeout-minutes: 2
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            vtavision-web:ci > "$RUNNER_TEMP/refused.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/refused.log"
          test "$code" -eq 1
          grep -q "The web app cannot start in production" "$RUNNER_TEMP/refused.log"
          grep -q "SESSION_SECRET: Required" "$RUNNER_TEMP/refused.log"

      - name: Refuse it with NEXT_PHASE naming the build
        timeout-minutes: 2
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e NEXT_PHASE=phase-production-build vtavision-web:ci > "$RUNNER_TEMP/phase.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/phase.log"
          test "$code" -eq 1
          grep -q "SESSION_SECRET: Required" "$RUNNER_TEMP/phase.log"

      - name: Refuse it with settings that widen what Node.js trusts
        timeout-minutes: 2
        run: |
          # The schema reads these once its required settings are there: three random stand-ins, masked.
          umask 077
          required="$RUNNER_TEMP/required.env"
          for name in SESSION_SECRET HEALTHCHECK_API_TOKEN STORAGE_SIGNING_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$required"
          done
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env-file "$required" -e NODE_OPTIONS=--use-openssl-ca -e NODE_USE_SYSTEM_CA=1 -e OPENSSL_CONF=/x \
            vtavision-web:ci > "$RUNNER_TEMP/trust.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/trust.log"
          test "$code" -eq 1
          grep -qF "  - NODE_OPTIONS: NODE_OPTIONS must not be set in production: " "$RUNNER_TEMP/trust.log"
          grep -qF "  - NODE_USE_SYSTEM_CA: NODE_USE_SYSTEM_CA must not be set in production: " "$RUNNER_TEMP/trust.log"
          grep -qF "  - OPENSSL_CONF: OPENSSL_CONF must not be set in production: " "$RUNNER_TEMP/trust.log"

      - name: Check the image's user, entrypoint and environment
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' vtavision-web:ci)" = "1000:1000"
          test "$(docker image inspect -f '{{json .Config.Entrypoint}}' vtavision-web:ci)" = \
            '["/usr/bin/env","-u","NEXT_PHASE","node","apps/web/server.js"]'
          env_json="$(docker image inspect -f '{{json .Config.Env}}' vtavision-web:ci)"
          if printf '%s' "$env_json" | grep -qi proxy; then
            echo "The image's environment names a proxy." >&2
            exit 1
          fi
          docker image inspect -f '{{json .Config.Labels}}' vtavision-web:ci

      - name: Serve with stand-in settings
        timeout-minutes: 5
        run: |
          # Sixteen settings a production start needs, each a stand-in: random secrets, a database on
          # port 1 of loopback, and names under .test, which no resolver answers. Kept in a file only
          # this user can read, and never printed.
          umask 077
          settings="$RUNNER_TEMP/web-image.env"
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "HEALTHCHECK_API_TOKEN=$(openssl rand -hex 32)"
            echo "STORAGE_SIGNING_SECRET=$(openssl rand -hex 32)"
            echo "MFA_SECRET_KEY=$(openssl rand -hex 32)"
            echo "DATABASE_URL=postgresql://rd10:$(openssl rand -hex 32)@127.0.0.1:1/rd10"
            echo "APP_BASE_URL=https://app.rd10.test"
            echo "FORWARDED_FOR_TRUSTED_ENTRIES=1"
            echo "GOOGLE_CLOUD_STORAGE_BUCKET=rd10-stand-in"
            echo "CLAMAV_HOST=clamav.rd10.test"
            echo "SMTP_HOST=mail.rd10.test"
            echo "SMTP_PORT=465"
            echo "SMTP_TLS=implicit"
            echo "SMTP_USER=rd10"
            echo "SMTP_PASSWORD=$(openssl rand -hex 32)"
            echo "SMTP_EHLO_NAME=app.rd10.test"
            echo "EMAIL_FROM=noreply@rd10.test"
          } > "$settings"
          docker run -d --name web --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env-file "$settings" vtavision-web:ci
          # At most 30 tries, a second apart: the server needs well under one to start.
          for try in $(seq 1 30); do
            if docker exec web node -e \
              "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
            then
              break
            fi
            if [ "$try" -eq 30 ]; then
              docker logs web
              exit 1
            fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/probe.mjs" <<'EOF'
          import { request } from "node:http";
          const base = "http://127.0.0.1:3000";
          const check = (ok, what) => {
            console.log(`${ok ? "ok" : "FAILED"}: ${what}`);
            if (!ok) process.exitCode = 1;
          };
          const live = await fetch(`${base}/api/health`);
          check(live.status === 200, `liveness answers ${live.status}`);
          check(live.headers.has("strict-transport-security"), "liveness sends HSTS");
          check(!live.headers.has("x-powered-by"), "liveness sends no X-Powered-By");
          const page = await fetch(`${base}/login`);
          const policy = page.headers.get("content-security-policy") ?? "";
          check(page.status === 200, `the sign-in page answers ${page.status}`);
          check(policy.includes("'nonce-"), "the sign-in page's policy carries a nonce");
          // A 404 renders per request (ADR-0188): every script carries the nonce of its own answer's policy.
          const missing = await fetch(`${base}/no-such-page`);
          const missingNonce = /'nonce-([^']+)'/.exec(missing.headers.get("content-security-policy") ?? "")?.[1];
          const missingScripts = (await missing.text()).match(/<script\b[^>]*>/g) ?? [];
          check(missing.status === 404, `an unknown page answers ${missing.status}`);
          check(missingNonce !== undefined, "the 404 page's policy carries a nonce");
          const nonced = missingScripts.filter((script) => script.includes(` nonce="${missingNonce}"`)).length;
          check(missingScripts.length > 0, `the 404 page has ${missingScripts.length} scripts`);
          check(nonced === missingScripts.length, `${nonced} of the 404 page's scripts carry its nonce`);
          // The API policy where the middleware does not run, from a build (ADR-0188 Decision 4). Fetch joins two
          // headers of one name with a comma, which the policy has none of, so equality means exactly one.
          for (const path of ["/_next", "/_next/nothing", "/favicon.ico"]) {
            const unmatched = await fetch(`${base}${path}`);
            const sent = unmatched.headers.get("content-security-policy");
            check(unmatched.status === 404, `${path} answers ${unmatched.status}`);
            check(sent === "default-src 'none'; frame-ancestors 'none'; sandbox", `${path} sends the policy ${sent}`);
          }
          // No image optimizer (images.unoptimized): Next.js answers 404 before validating or fetching the query.
          const image = await fetch(`${base}/_next/image?url=%2Ffavicon.ico&w=64&q=75`);
          check(image.status === 404, `/_next/image answers ${image.status}`);
          const anonymous = await fetch(`${base}/api/health/ready`);
          check(anonymous.status === 401, `readiness without the token answers ${anonymous.status}`);
          const ready = await fetch(`${base}/api/health/ready`, {
            headers: { authorization: `Bearer ${process.env.HEALTHCHECK_API_TOKEN}` },
          });
          check(ready.status === 503, `readiness with the token answers ${ready.status}`);
          // Asked through another host name (fetch would send its own Host): the answer is a path, never the
          // bind address the server builds request.url on (ADR-0175 Decision 7, RD-10b).
          const logout = await new Promise((resolve, reject) => {
            const headers = { host: "app.rd10.test", origin: "https://app.rd10.test" };
            request(`${base}/api/auth/logout`, { method: "POST", headers }, resolve).on("error", reject).end();
          });
          logout.resume();
          check(logout.statusCode === 303, `sign-out answers ${logout.statusCode}`);
          check(logout.headers.location === "/login", `sign-out's Location is ${logout.headers.location}`);
          const cookie = String(logout.headers["set-cookie"] ?? "");
          check(/^rev_session=;/.test(cookie), "sign-out deletes the session cookie");
          // A sign-in, against the stand-in database: the limiter cannot answer, so the route refuses in its own
          // words, and the server logs one line for a failure it does not know (ADR-0177).
          const signIn = await new Promise((resolve, reject) => {
            const headers = {
              host: "app.rd10.test",
              origin: "https://app.rd10.test",
              "x-forwarded-for": "203.0.113.7",
              "content-type": "application/x-www-form-urlencoded",
            };
            const typed = "email=rd10-typed%40rd10.test&password=rd10-typed-canary";
            request(`${base}/api/auth/login`, { method: "POST", headers }, resolve).on("error", reject).end(typed);
          });
          signIn.resume();
          check(signIn.statusCode === 303, `sign-in answers ${signIn.statusCode}`);
          const refused = signIn.headers.location;
          check(refused === "/login?error=Sign+in+failed", `sign-in's Location is ${refused}`);
          EOF
          docker exec -i web node --input-type=module - < "$RUNNER_TEMP/probe.mjs"
          test "$(docker exec web id -u)" = "1000"
          docker logs web > "$RUNNER_TEMP/web.log" 2>&1
          cat "$RUNNER_TEMP/web.log"
          # The database probe's own code: Prisma's OpenSSL 3 engine loaded and asked port 1.
          grep -q '"probe":"database","code":"P1001"' "$RUNNER_TEMP/web.log"
          if grep '"probe":"database","code":"UNEXPECTED"' "$RUNNER_TEMP/web.log"; then
            exit 1
          fi
          # The sign-in's one line: the limiter's own error, naming Prisma's for the database it could not
          # reach (ADR-0177). Nothing typed and no stand-in reached the log; nothing secret is printed.
          line="$(grep '"component":"request"' "$RUNNER_TEMP/web.log" | grep '"route":"POST /api/auth/login"')"
          test "$(printf '%s\n' "$line" | grep -c .)" -eq 1
          printf '%s' "$line" | grep -q '"errorName":"RateLimiterUnavailable"'
          printf '%s' "$line" | grep -q '"causeName":"PrismaClientInitializationError"'
          # Each typed value as sent or as read (rd10-typed%40… and rd10-typed@…), and the client's address.
          for sent in rd10-typed 203.0.113.7; do
            if grep -qF "$sent" "$RUNNER_TEMP/web.log"; then echo "A value sent reached the log" >&2; exit 1; fi
          done
          for name in SESSION_SECRET HEALTHCHECK_API_TOKEN STORAGE_SIGNING_SECRET MFA_SECRET_KEY SMTP_PASSWORD; do
            value="$(sed -n "s/^$name=//p" "$settings")"; test -n "$value"
            if grep -qF "$value" "$RUNNER_TEMP/web.log"; then echo "$name reached the log" >&2; exit 1; fi
          done
          password="$(sed -n 's|^DATABASE_URL=postgresql://rd10:\([0-9a-f]*\)@.*|\1|p' "$settings")"
          test -n "$password"
          if grep -qF "$password" "$RUNNER_TEMP/web.log"; then
            echo "The database password reached the log" >&2
            exit 1
          fi

      - name: Print what the image holds
        run: |
          docker run --rm --network none --read-only --entrypoint dpkg-query vtavision-web:ci \
            -W -f '${Package}\t${Version}\n'
          docker run --rm --network none --read-only --entrypoint node vtavision-web:ci --version
          docker image inspect -f '{{.Size}} bytes' vtavision-web:ci

      - name: Write the image's SBOM
        # Syft holds no vulnerability database: it reads the very image this job tested, with no network.
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/scan"
          mkdir -p "$dir/image" "$dir/sbom" "$dir/syft" "$dir/grype"
          docker image save -o "$dir/image/image.tar" vtavision-web:ci
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e SYFT_CHECK_FOR_APP_UPDATE=false -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
            -v "$dir/image:/image:ro" -v "$dir/sbom:/sbom" -v "$dir/syft:/work" \
            "$SYFT_PIN" docker-archive:/image/image.tar \
            -o syft-json=/sbom/image.syft.json -o cyclonedx-json@1.6=/sbom/image.cdx.json
          rm "$dir/image/image.tar"
          jq -e '.specVersion == "1.6"' "$dir/sbom/image.cdx.json"
          jq -r '"\(.artifacts | length) packages"' "$dir/sbom/image.syft.json"
          sha256sum "$dir/sbom/image.cdx.json"
          df -h "$RUNNER_TEMP"

      - name: Fetch the vulnerability database
        # The one scanner run with a network: Grype's database, into Grype's own folder alone.
        # Longer than Grype's own 300-second download limit, so a slow download fails with Grype's error.
        timeout-minutes: 8
        run: |
          dir="$RUNNER_TEMP/scan"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            -e GRYPE_DB_CACHE_DIR=/work/db -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
            -v "$dir/grype:/work" "$GRYPE_PIN" db update
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_AUTO_UPDATE=false \
            -e GRYPE_DB_CACHE_DIR=/work/db -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
            -v "$dir/grype:/work" "$GRYPE_PIN" db status

      - name: Scan the SBOM
        # Every match is listed; a fixable critical one fails with Grype's code 2, any other code is Grype's own.
        timeout-minutes: 3
        run: |
          dir="$RUNNER_TEMP/scan"
          grype() {
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_AUTO_UPDATE=false \
              -e GRYPE_DB_CACHE_DIR=/work/db -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
              -v "$dir/grype:/work" -v "$dir/sbom:/sbom:ro" \
              -v "$GITHUB_WORKSPACE/.github/scan/grype.yaml:/cfg/grype.yaml:ro" \
              "$GRYPE_PIN" sbom:/sbom/image.syft.json -c /cfg/grype.yaml "$@"
          }
          if ! grype --show-suppressed -o table; then
            echo "Grype itself failed listing every match: not a finding." >&2
            exit 1
          fi
          set +e
          grype --only-fixed --fail-on critical -o table
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "A fixable critical finding: fix it, or accept it in .github/scan/grype.yaml and TODO.md." >&2
          elif [ "$code" -ne 0 ]; then
            echo "Grype itself failed with code $code: not a finding." >&2
          fi
          exit "$code"

      - name: Stop the server
        if: always()
        # The log holds only stand-ins; printed here too, so a failed probe keeps it.
        run: |
          docker logs web || true
          docker rm -f web || true

  worker-image:
    # The worker's runtime layer (ADR-0176): the pinned base, Debian 13's
    # FFmpeg and the six disclosure images, and no worker code. The media
    # suites run on that very FFmpeg stage with no network; the image's check
    # and its default, which refuses, run with no network and a read-only root.
    # Last, the very image is scanned with pinned Syft and Grype (ADR-0180).
    # Nothing is pushed: no registry, login, secret or cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REVISION: ${{ github.sha }}
      SYFT_PIN: ghcr.io/anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
      GRYPE_PIN: ghcr.io/anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the media suites' stage
        # Debian's mirror has taken minutes; a hung one fails here, not at 30.
        timeout-minutes: 20
        run: >-
          docker buildx build --provenance=false --load --platform linux/amd64
          -f apps/worker/Dockerfile --target media-test
          --label "org.opencontainers.image.revision=$REVISION"
          --tag vtavision-worker-media:ci .

      - name: Run the media suites against the image's FFmpeg
        # The stage runs as root, CI only; it never becomes the image.
        timeout-minutes: 15
        run: |
          docker run --rm --network none --entrypoint ffmpeg vtavision-worker-media:ci -hide_banner -version
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges vtavision-worker-media:ci

      - name: Build the worker image
        timeout-minutes: 10
        run: >-
          docker buildx build --provenance=false --load --platform linux/amd64
          -f apps/worker/Dockerfile
          --label "org.opencontainers.image.revision=$REVISION"
          --tag vtavision-worker:ci .

      - name: Check that both share the FFmpeg stage
        # The image's last three layers are its three COPY lines; every layer
        # below them must be the media stage's, so the suites ran this FFmpeg.
        run: |
          media="$(docker image inspect -f '{{range .RootFS.Layers}}{{println .}}{{end}}' vtavision-worker-media:ci)"
          worker="$(docker image inspect -f '{{range .RootFS.Layers}}{{println .}}{{end}}' vtavision-worker:ci)"
          shared="$(printf '%s\n' "$worker" | grep . | head -n -3)"
          count="$(printf '%s\n' "$shared" | grep -c .)"
          test "$count" -ge 2
          test "$(printf '%s\n' "$media" | head -n "$count")" = "$shared"

      - name: Check the image's user, files, entrypoint and environment
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' vtavision-worker:ci)" = "1000:1000"
          test "$(docker run --rm --network none --read-only --entrypoint id vtavision-worker:ci -u)" = "1000"
          docker run --rm --network none --read-only --entrypoint find vtavision-worker:ci \
            /app /usr/local/bin/worker-image-check -printf '%u:%g %m %p\n'
          loose="$(docker run --rm --network none --read-only --entrypoint find vtavision-worker:ci \
            /app /usr/local/bin/worker-image-check ! -user 0 -o ! -group 0 -o -perm /o=w)"
          test -z "$loose"
          test "$(docker image inspect -f '{{json .Config.Entrypoint}}' vtavision-worker:ci)" = \
            '["docker-entrypoint.sh"]'
          env_json="$(docker image inspect -f '{{json .Config.Env}}' vtavision-worker:ci)"
          if printf '%s' "$env_json" | grep -qi proxy; then
            echo "The image's environment names a proxy." >&2
            exit 1
          fi
          docker image inspect -f '{{json .Config.Cmd}}' vtavision-worker:ci
          docker image inspect -f '{{json .Config.Labels}}' vtavision-worker:ci

      - name: Run the image's check
        timeout-minutes: 2
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            vtavision-worker:ci worker-image-check

      - name: Refuse to run by default
        timeout-minutes: 2
        run: |
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            vtavision-worker:ci > "$RUNNER_TEMP/refused.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/refused.log"
          test "$code" -eq 2
          grep -qF "The worker has no production runtime until part 2 (ADR-0151 Decision 4)." "$RUNNER_TEMP/refused.log"

      - name: Print what the image holds
        run: |
          docker run --rm --network none --read-only --entrypoint dpkg-query vtavision-worker:ci \
            -W -f '${Package}\t${Version}\n'
          docker run --rm --network none --read-only --entrypoint node vtavision-worker:ci --version
          docker image inspect -f '{{.Size}} bytes' vtavision-worker:ci

      - name: Write the image's SBOM
        # Syft holds no vulnerability database: it reads the very image this job tested, with no network.
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/scan"
          mkdir -p "$dir/image" "$dir/sbom" "$dir/syft" "$dir/grype"
          docker image save -o "$dir/image/image.tar" vtavision-worker:ci
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e SYFT_CHECK_FOR_APP_UPDATE=false -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
            -v "$dir/image:/image:ro" -v "$dir/sbom:/sbom" -v "$dir/syft:/work" \
            "$SYFT_PIN" docker-archive:/image/image.tar \
            -o syft-json=/sbom/image.syft.json -o cyclonedx-json@1.6=/sbom/image.cdx.json
          rm "$dir/image/image.tar"
          jq -e '.specVersion == "1.6"' "$dir/sbom/image.cdx.json"
          jq -r '"\(.artifacts | length) packages"' "$dir/sbom/image.syft.json"
          sha256sum "$dir/sbom/image.cdx.json"
          df -h "$RUNNER_TEMP"

      - name: Fetch the vulnerability database
        # The one scanner run with a network: Grype's database, into Grype's own folder alone.
        # Longer than Grype's own 300-second download limit, so a slow download fails with Grype's error.
        timeout-minutes: 8
        run: |
          dir="$RUNNER_TEMP/scan"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e GRYPE_CHECK_FOR_APP_UPDATE=false \
            -e GRYPE_DB_CACHE_DIR=/work/db -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
            -v "$dir/grype:/work" "$GRYPE_PIN" db update
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_AUTO_UPDATE=false \
            -e GRYPE_DB_CACHE_DIR=/work/db -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
            -v "$dir/grype:/work" "$GRYPE_PIN" db status

      - name: Scan the SBOM
        # Every match is listed; a fixable critical one fails with Grype's code 2, any other code is Grype's own.
        timeout-minutes: 3
        run: |
          dir="$RUNNER_TEMP/scan"
          grype() {
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" -e GRYPE_CHECK_FOR_APP_UPDATE=false -e GRYPE_DB_AUTO_UPDATE=false \
              -e GRYPE_DB_CACHE_DIR=/work/db -e TMPDIR=/work -e XDG_CACHE_HOME=/work \
              -v "$dir/grype:/work" -v "$dir/sbom:/sbom:ro" \
              -v "$GITHUB_WORKSPACE/.github/scan/grype.yaml:/cfg/grype.yaml:ro" \
              "$GRYPE_PIN" sbom:/sbom/image.syft.json -c /cfg/grype.yaml "$@"
          }
          if ! grype --show-suppressed -o table; then
            echo "Grype itself failed listing every match: not a finding." >&2
            exit 1
          fi
          set +e
          grype --only-fixed --fail-on critical -o table
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "A fixable critical finding: fix it, or accept it in .github/scan/grype.yaml and TODO.md." >&2
          elif [ "$code" -ne 0 ]; then
            echo "Grype itself failed with code $code: not a finding." >&2
          fi
          exit "$code"

  production-mode:
    # The web image as built, run against stand-ins (ADR-0178), with Google's
    # names as aliases on a network with no way out, behind a TLS front. Every
    # value is this run's, in files, never printed; Mailpit relays nothing.
    # Nothing is pushed: no registry, login, secret or cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      REVISION: ${{ github.sha }}
      PG_IMAGE: postgres:16.16-trixie@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
      GCS_IMAGE: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
      CLAMAV_IMAGE: clamav/clamav:1.5.5@sha256:64e30c0bf976198024deb3dc6d5cfe2485fb969c0f73549ba0fdb364b9469614
      MAILPIT_IMAGE: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
      NODE_IMAGE: node:22-trixie-slim@sha256:f0960f8dc047f358e3fb428f36ccba21732194fa5f0cac849f401e63e62fb9e6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @app/database run db:generate

      - name: Install Chromium for Playwright
        # Before any container starts, so its apt-get touches no running stand-in.
        timeout-minutes: 30
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the web image
        timeout-minutes: 20
        run: >-
          docker buildx build --provenance=false --load --platform linux/amd64
          -f apps/web/Dockerfile
          --label "org.opencontainers.image.revision=$REVISION"
          --tag vtavision-web:ci .

      - name: Make this run's authority, leaves and settings
        # Files only this user reads, each value masked too. The authority's key is deleted once it has signed the
        # three leaves; each leaf is readable by the one stand-in that mounts it.
        timeout-minutes: 1
        run: |
          umask 077
          dir="$RUNNER_TEMP/rd11"
          mkdir "$dir"
          ec="-newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes"
          openssl req -x509 $ec -keyout "$dir/ca.key" -out "$dir/ca.pem" -days 1 -subj /CN=ca.rd11.test
          for leaf in gcs:storage.googleapis.com mail:mail.rd11.test app:app.rd11.test; do
            mkdir -m 0755 "$dir/${leaf%%:*}"
            echo "subjectAltName=DNS:${leaf#*:}" > "$dir/ext.cnf"
            openssl req $ec -keyout "$dir/${leaf%%:*}/key.pem" -out "$dir/leaf.csr" -subj "/CN=${leaf#*:}"
            openssl x509 -req -in "$dir/leaf.csr" -CA "$dir/ca.pem" -CAkey "$dir/ca.key" -CAcreateserial \
              -out "$dir/${leaf%%:*}/cert.pem" -days 1 -extfile "$dir/ext.cnf"
          done
          rm "$dir/ca.key" "$dir/ca.srl" "$dir/leaf.csr" "$dir/ext.cnf"
          chmod 0644 "$dir/ca.pem" "$dir"/*/cert.pem "$dir"/*/key.pem
          for name in session health storage mfa smtp db; do openssl rand -hex 32 > "$dir/$name.secret"; done
          openssl rand -hex 16 > "$dir/metadata.secret"
          for name in "$dir"/*.secret; do echo "::add-mask::$(cat "$name")"; done
          db="$(cat "$dir/db.secret")"
          bucket="rd11-$(openssl rand -hex 3)"
          {
            echo "SESSION_SECRET=$(cat "$dir/session.secret")"
            echo "HEALTHCHECK_API_TOKEN=$(cat "$dir/health.secret")"
            echo "STORAGE_SIGNING_SECRET=$(cat "$dir/storage.secret")"
            echo "MFA_SECRET_KEY=$(cat "$dir/mfa.secret")"
            echo "DATABASE_URL=postgresql://rd11:$db@db.rd11.test:5432/rd11"
            echo "APP_BASE_URL=https://app.rd11.test:8443"
            echo "FORWARDED_FOR_TRUSTED_ENTRIES=1"
            echo "GOOGLE_CLOUD_STORAGE_BUCKET=$bucket"
            echo "CLAMAV_HOST=clamav.rd11.test"
            echo "SMTP_HOST=mail.rd11.test"
            echo "SMTP_PORT=1025"
            echo "SMTP_TLS=starttls"
            echo "SMTP_USER=rd11"
            echo "SMTP_PASSWORD=$(cat "$dir/smtp.secret")"
            echo "SMTP_EHLO_NAME=app.rd11.test"
            echo "EMAIL_FROM=noreply@rd11.test"
          } > "$dir/web.env"
          printf 'POSTGRES_USER=rd11\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=rd11\n' "$db" > "$dir/pg.env"
          printf 'DATABASE_URL=postgresql://rd11:%s@127.0.0.1:5432/rd11\nBUCKET=%s\n' "$db" "$bucket" \
            > "$dir/runner.env"
          echo 'GOOGLE_CLOUD_STORAGE_TEST_ENDPOINT=http://127.0.0.1:4480' >> "$dir/runner.env"
          echo 'MAILPIT_TEST_API_PORT=8025' >> "$dir/runner.env"
          echo "RD11_METADATA_TOKEN=$(cat "$dir/metadata.secret")" > "$dir/metadata.env"
          echo "Authorization: Bearer $(cat "$dir/health.secret")" > "$dir/ready.header"
          # The values the job makes or types, which the server's log is checked against before it is printed.
          { cat "$dir"/*.secret; echo 203.0.113.7; seq -f 'rd11-typed-%g' 1 7; seq -f '198.51.100.%g' 1 6; } \
            > "$dir/all-values"

      - name: Name the app on the runner
        timeout-minutes: 1
        run: echo '127.0.0.1 app.rd11.test' | sudo tee -a /etc/hosts

      - name: Start the stand-ins
        timeout-minutes: 10
        run: |
          dir="$RUNNER_TEMP/rd11"
          docker network create --internal --subnet 172.30.11.0/24 rd11-int
          docker network create rd11-edge
          # On both networks: started on the edge one, published on loopback only, then named on the internal one.
          docker run -d --name db --network rd11-edge -p 127.0.0.1:5432:5432 --env-file "$dir/pg.env" "$PG_IMAGE"
          docker network connect --ip 172.30.11.12 --alias db.rd11.test rd11-int db
          docker run -d --name gcs --network rd11-edge -p 127.0.0.1:4480:8000 -v "$dir/gcs:/run/rd11/tls:ro" \
            -e FAKE_GCS_SCHEME=both -e FAKE_GCS_PORT=443 -e FAKE_GCS_PORT_HTTP=8000 -e FAKE_GCS_BACKEND=memory \
            -e FAKE_GCS_LOG_LEVEL=warn -e FAKE_GCS_CERT_LOCATION=/run/rd11/tls/cert.pem \
            -e FAKE_GCS_PRIVATE_KEY_LOCATION=/run/rd11/tls/key.pem "$GCS_IMAGE"
          docker network connect --ip 172.30.11.10 --alias storage.googleapis.com rd11-int gcs
          docker run -d --name mailpit --network rd11-edge -p 127.0.0.1:8025:8025 -v "$dir/mail:/run/rd11/tls:ro" \
            -e MP_SMTP_TLS_CERT=/run/rd11/tls/cert.pem -e MP_SMTP_TLS_KEY=/run/rd11/tls/key.pem \
            -e MP_SMTP_REQUIRE_STARTTLS=true -e MP_SMTP_AUTH_ACCEPT_ANY=true -e MP_DISABLE_VERSION_CHECK=true \
            "$MAILPIT_IMAGE"
          docker network connect --ip 172.30.11.14 --alias mail.rd11.test rd11-int mailpit
          # On the internal network only.
          docker run -d --name clamav --network rd11-int --ip 172.30.11.13 --network-alias clamav.rd11.test \
            -e CLAMAV_NO_FRESHCLAMD=true -e CLAMAV_NO_MILTERD=true "$CLAMAV_IMAGE"
          docker run -d --name metadata --network rd11-int --ip 172.30.11.11 --network-alias metadata.google.internal \
            --user 1000:1000 --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env-file "$dir/metadata.env" -v "$GITHUB_WORKSPACE/tests/production:/srv/rd11:ro" \
            "$NODE_IMAGE" node /srv/rd11/metadata-server.mjs
          # Bounded waits, a second apart: ClamAV loads its signatures in about 13 s, the others in a few. A stand-in
          # that does not answer prints its last lines, none of which holds a value of this run.
          ready() {
            name="$1"; tries="$2"; shift 2
            for try in $(seq 1 "$tries"); do
              if docker exec "$name" "$@" > /dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "$name did not answer in $tries tries" >&2
            docker logs --tail 50 "$name" >&2
            return 1
          }
          ready db 30 pg_isready -h 127.0.0.1 -U rd11 -d rd11
          ready gcs 30 wget -q -O /dev/null http://127.0.0.1:8000/_internal/healthcheck
          ready mailpit 30 /mailpit readyz
          ready clamav 90 clamdcheck.sh
          ready metadata 30 node -e "require('node:http').get('http://127.0.0.1/',
            (r) => process.exit(r.statusCode === 404 ? 0 : 1)).on('error', () => process.exit(1))"

      - name: Apply the migrations and make the bucket from the runner
        timeout-minutes: 5
        run: |
          set -a; . "$RUNNER_TEMP/rd11/runner.env"; set +a
          pnpm --filter @app/database run db:migrate
          curl -sS --fail -o /dev/null -X POST -H 'content-type: application/json' \
            --data "{\"name\":\"$BUCKET\"}" 'http://127.0.0.1:4480/storage/v1/b?project=rd11'

      - name: Start the web app behind the front
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/rd11"
          # As built: its entrypoint and start check, the web-image job's flags, and this run's authority by one name.
          docker run -d --name web --network rd11-int --read-only --cap-drop ALL --security-opt no-new-privileges \
            --env-file "$dir/web.env" -v "$dir/ca.pem:/run/rd11/ca.pem:ro" -e NODE_EXTRA_CA_CERTS=/run/rd11/ca.pem \
            vtavision-web:ci
          docker run -d --name front --network rd11-edge -p 127.0.0.1:8443:8443 --user 1000:1000 --read-only \
            --cap-drop ALL --security-opt no-new-privileges -v "$dir/app:/run/rd11/tls:ro" \
            -v "$GITHUB_WORKSPACE/tests/production:/srv/rd11:ro" "$NODE_IMAGE" node /srv/rd11/tls-front.mjs
          docker network connect --ip 172.30.11.15 rd11-int front
          # At most 30 tries a second apart, through the front, trusting this run's authority alone.
          for try in $(seq 1 30); do
            if curl -sS -f -o /dev/null --cacert "$dir/ca.pem" https://app.rd11.test:8443/api/health; then break; fi
            if [ "$try" -eq 30 ]; then docker logs front; exit 1; fi
            sleep 1
          done
          # The start check let it start and did not end it: it still runs five seconds later.
          sleep 5
          docker exec web true

      - name: Check liveness, readiness, the names and the way out
        timeout-minutes: 2
        run: |
          umask 077
          dir="$RUNNER_TEMP/rd11"
          expect() {
            want="$1"; shift
            got="$(curl -sS --cacert "$dir/ca.pem" -o "$dir/answer" -w '%{http_code}' "$@")"
            echo "${*: -1} answers $got, $want expected"
            test "$got" = "$want"
          }
          expect 200 https://app.rd11.test:8443/api/health
          expect 401 https://app.rd11.test:8443/api/health/ready
          # With a client's own X-Forwarded-For entry, which the front keeps and appends to, and no log may hold.
          ready=0
          expect 200 -H @"$dir/ready.header" -H 'X-Forwarded-For: 203.0.113.7' \
            https://app.rd11.test:8443/api/health/ready && ready=1
          # Each check before the verdict; if not ready, the metadata stand-in's last lines (no value) too.
          jq -r '.checks[] | "\(.name): ok=\(.ok), \(.detail)"' "$dir/answer" || true
          if [ "$ready" != 1 ]; then docker logs --tail 50 metadata >&2; exit 1; fi
          jq -e '.status == "ready" and (.checks | length) == 5 and all(.checks[]; .ok)' "$dir/answer"
          jq -e '.checks[] | select(.name == "storage") | .detail == "adapter=gcs, answers"' "$dir/answer"
          test "$(docker exec web getent hosts storage.googleapis.com | awk '{ print $1 }')" = 172.30.11.10
          test "$(docker exec web getent hosts metadata.google.internal | awk '{ print $1 }')" = 172.30.11.11
          # TEST-NET-1 (RFC 5737): the internal network has no route out.
          docker exec web node -e "require('node:net').connect(443, '192.0.2.1').on('connect', () => process.exit(1))
            .on('error', (e) => { console.log(e.code); process.exit(/^E(NET|HOST)UNREACH$/.test(e.code) ? 0 : 1); })"
          # The adapter asked for its token as Cloud Run's metadata server requires, and sent it no credential.
          docker logs metadata > "$dir/metadata.log" 2>&1
          grep -cF '"path":"/computeMetadata/v1/instance/service-accounts/default/token","flavor":"Google"' \
            "$dir/metadata.log"
          if grep -qF '"authorization":true' "$dir/metadata.log"; then exit 1; fi
          # ClamAV answers at the address the web app scans with.
          docker exec web node -e "const s = require('node:net').connect(3310, 'clamav.rd11.test'); let a = '';
            s.on('connect', () => s.end('zPING\0')).on('data', (d) => (a += d))
            .on('end', () => process.exit(a.startsWith('PONG') ? 0 : 1))"

      - name: Read the server's log
        timeout-minutes: 1
        run: |
          umask 077
          dir="$RUNNER_TEMP/rd11"
          docker logs web > "$dir/web.log" 2>&1
          # No secret, database password, metadata token or client-sent address reached it, and no failure.
          { cat "$dir"/*.secret; echo 203.0.113.7; } > "$dir/values"
          test "$(grep -c . "$dir/values")" -eq 8
          if grep -qFf "$dir/values" "$dir/web.log"; then
            : > "$dir/leaked"
            echo "A value of this run reached the log" >&2
            exit 1
          fi
          for word in '"component":"request"' CLIENT_ADDRESS_UNAVAILABLE ORIGIN_REFUSED '"component":"readiness"'; do
            if grep -qF "$word" "$dir/web.log"; then echo "The log holds $word" >&2; exit 1; fi
          done

      - name: Run the browser through the front
        # Mailpit, the emulator and the database are read on loopback, from runner.env; no value is printed. The spec
        # lists the values it uses in browser-values, which the server's log is checked against too.
        id: browser
        timeout-minutes: 20
        run: |
          set -a; . "$RUNNER_TEMP/rd11/runner.env"; set +a
          pnpm run test:production

      - name: Hold the sign-in limit by the front's entry
        # After the browser, whose sign-ins share the key: six typed addresses and six spoofed entries, and the sixth
        # is refused by the client address's limit, keyed by the one entry the front appends (ADR-0170).
        timeout-minutes: 2
        run: |
          dir="$RUNNER_TEMP/rd11"
          for try in 1 2 3 4 5 6; do
            curl -sS --cacert "$dir/ca.pem" -o /dev/null -w '%{http_code} %header{location}\n' \
              -H 'Origin: https://app.rd11.test:8443' -H "X-Forwarded-For: 198.51.100.$try" \
              --data-urlencode "email=rd11-typed-$try@example.test" --data-urlencode "password=rd11-typed-$try" \
              https://app.rd11.test:8443/api/auth/login >> "$dir/limit"
          done
          cat "$dir/limit"
          test "$(grep -c '^303 /login?error=Invalid+email+or+password$' "$dir/limit")" -eq 5
          tail -n 1 "$dir/limit" | grep -v Invalid | grep -q '^303 /login?error='
          test "$(docker logs web 2>&1 | grep -c '"code":"RATE_LIMITED","action":"SIGN_IN","dimension":"client"')" -eq 1

      - name: Stop the database, then start it again
        # Readiness says so and recovers with the web app left running; a sign-in meanwhile is refused in the route's
        # own words and logged once (ADR-0177). A readiness that stays 503 is a finding, never a silent restart.
        timeout-minutes: 12
        run: |
          dir="$RUNNER_TEMP/rd11"
          ready() { curl -sS --max-time 20 --cacert "$dir/ca.pem" -o "$dir/answer" -w '%{http_code}' \
            -H @"$dir/ready.header" https://app.rd11.test:8443/api/health/ready; }
          docker stop db
          test "$(ready)" = 503
          jq -e '.checks[] | select(.name == "database") | .ok == false' "$dir/answer"
          got="$(curl -sS --max-time 20 --cacert "$dir/ca.pem" -o /dev/null -w '%{http_code} %header{location}' \
            -H 'Origin: https://app.rd11.test:8443' --data-urlencode 'email=rd11-typed-7@example.test' \
            --data-urlencode 'password=rd11-typed-7' https://app.rd11.test:8443/api/auth/login)"
          echo "$got"
          test "$got" = '303 /login?error=Sign+in+failed'
          docker start db
          for try in $(seq 1 30); do
            if [ "$(ready)" = 200 ]; then echo "ready again after $try tries"; break; fi
            if [ "$try" -eq 30 ]; then echo "readiness did not recover in 30 tries" >&2; exit 1; fi
            sleep 1
          done

      - name: Answer one error no catch takes
        # A same-origin sign-in whose multipart body has no boundary: `request.formData()` throws a TypeError outside
        # the route's `try`, before the limiter, so Next.js answers 500 and writes two JSON lines, its print through
        # the console bridge and `onRequestError`'s, which the log report requires once each (ADR-0187).
        timeout-minutes: 2
        run: |
          dir="$RUNNER_TEMP/rd11"
          got="$(curl -sS --max-time 20 --cacert "$dir/ca.pem" -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://app.rd11.test:8443' -H 'Content-Type: multipart/form-data' --data 'x' \
            https://app.rd11.test:8443/api/auth/login)"
          echo "$got"
          test "$got" = 500

      - name: Post page policy reports
        # One report of each kind from the sign-in page, an inline script refused: 204 and one INFO line each. One
        # from another origin's page: 204 and no line (ADR-0189 Decision 3). One past 16 KiB: 413. This run's mark
        # is in each page's query, referrer, policy and source, and in a blocked address where no line is expected;
        # it is listed, so the log report exits 2 if it is ever logged.
        timeout-minutes: 2
        run: |
          umask 077
          dir="$RUNNER_TEMP/rd11"
          mark="rd11-report-$(openssl rand -hex 8)"
          echo "$mark" >> "$dir/all-values"
          app=https://app.rd11.test:8443
          uri() {
            jq -nc --arg m "$mark" --arg o "$1" --arg b "$2" --arg pad "$3" '{"csp-report": {"document-uri":
              "\($o)/login?run=\($m)", referrer: "\($o)/reset-password?token=\($m)", "blocked-uri": $b,
              "effective-directive": "script-src-elem", "original-policy": "script-src nonce-\($m)",
              disposition: "enforce", "source-file": "\($o)/login?run=\($m)", "status-code": 200,
              "script-sample": $pad}}'
          }
          uri "$app" inline "" > "$dir/uri.json"
          uri https://elsewhere.rd11.test "$app/api/storage/download?token=$mark" "" > "$dir/elsewhere.json"
          pad="$(head -c 17000 /dev/zero | tr '\0' a)"
          uri "$app" "$app/api/storage/download?token=$mark" "$pad" > "$dir/large.json"
          jq -nc --arg m "$mark" --arg o "$app" '[{type: "csp-violation", age: 0, url: "\($o)/login?run=\($m)",
            user_agent: "rd11 \($m)", body: {documentURL: "\($o)/login?run=\($m)", blockedURL: "inline",
            referrer: "\($o)/reset-password?token=\($m)", effectiveDirective: "script-src-elem",
            disposition: "enforce", originalPolicy: "script-src nonce-\($m)", sourceFile: "\($o)/login?run=\($m)",
            statusCode: 200}}]' \
            > "$dir/to.json"
          post() {
            got="$(curl -sS --max-time 20 --cacert "$dir/ca.pem" -o /dev/null -w '%{http_code}' \
              -H "Origin: $app" -H "Content-Type: $1" --data-binary @"$dir/$2" "$app/api/csp-report")"
            echo "$2 answers $got, $3 expected"
            test "$got" = "$3"
          }
          post application/csp-report uri.json 204
          post application/reports+json to.json 204
          post application/csp-report elsewhere.json 204
          post application/csp-report large.json 413

      - name: Report the server's log
        # Counted by seven fields, here and in the job's summary, and nothing else of it; a listed value in it fails
        # the step and keeps the last step from printing the log.
        timeout-minutes: 1
        run: |
          umask 077
          dir="$RUNNER_TEMP/rd11"
          docker logs web > "$dir/web.log" 2>&1
          code=0
          node tests/production/log-report.mjs "$dir/web.log" "$dir/all-values" "$dir/browser-values" || code=$?
          if [ "$code" -eq 2 ]; then : > "$dir/leaked"; fi
          exit "$code"

      - name: Keep the browser's report of a failed run
        # Only when the browser itself failed: its step titles hold the run's throwaway passwords and a used code.
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-mode-report
          path: playwright-report/
          retention-days: 7

      - name: Stop the stand-ins
        if: always()
        # The web log is printed only when it holds none of the listed values, checked here whichever step failed;
        # the secrets are masked too, but a value changed on its way into the log would escape the mask.
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/rd11"
          if [ -s "$dir/all-values" ] && [ ! -e "$dir/leaked" ] && docker logs web > "$dir/web.log" 2>&1; then
            listed() { [ -s "$dir/$1" ] && grep -qFf "$dir/$1" "$dir/web.log"; }
            if listed all-values || listed browser-values; then
              echo "The web log is withheld: it holds a listed value" >&2
            else
              cat "$dir/web.log"
            fi
          fi
          docker rm -f web front metadata clamav mailpit gcs db || true
          docker network rm rd11-int rd11-edge || true
          rm -rf "$RUNNER_TEMP/rd11"
